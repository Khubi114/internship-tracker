# pipeline.yml: owned by Khubi. B and C add their jobs through Pull Requests;
# Khubi reviews and merges. Do not edit lint-and-unit or build-and-push without Khubi.
#
#   lint-and-unit -> build-and-push -> deploy-staging -> e2e-tests -> deploy-production
#      (Khubi)           (Khubi)            (B)             (C)             (B)
#
# Rules for every job: timeout-minutes 15, and deploy jobs name their needs:
# explicitly (GitHub counts a skipped job as a pass for required checks).

name: pipeline

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Khubi
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest, coverage gate 80%)
        run: pytest tests/unit --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Khubi
  build-and-push:
    name: build-and-push
    needs: lint-and-unit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tags
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            printf 'tags<<EOF\n%s\n%s\nEOF\n' "$IMAGE:${{ github.sha }}" "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            printf 'tags<<EOF\n%s\nEOF\n' "$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- Person B
  deploy-staging:
    name: deploy-staging
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: TODO (Person B) SSH to Staging EC2, pull image, docker compose up -d
        run: |
          echo "Image to deploy: ${{ needs.build-and-push.outputs.sha_tag }}"
          echo "Secrets available: SSH_PRIVATE_KEY, STAGING_HOST, GHCR_USERNAME, GHCR_TOKEN"
  # ---------------------------------------------------------------- Person C
  e2e-tests:
    name: e2e-tests
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: TODO (Person C) run Playwright against the Staging URL (secret STAGING_URL)
        run: echo "Playwright tests from tests/e2e go here"

  # ---------------------------------------------------------------- Person B
  deploy-production:
    name: deploy-production
    needs: [build-and-push, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: TODO (Person B) SSH to Production EC2, deploy same image, smoke check, rollback on fail
        run: |
          echo "Image to deploy: ${{ needs.build-and-push.outputs.sha_tag }}"
          echo "Secrets available: SSH_PRIVATE_KEY, PROD_HOST, GHCR_USERNAME, GHCR_TOKEN"
