# pipeline.yml: owned by Khubi. B and C add their jobs through Pull Requests;
# Khubi reviews and merges. Do not edit lint-and-unit or build-and-push without Khubi.
#
#   lint-and-unit -> build-and-push -> deploy-staging -> e2e-tests -> deploy-production
#      (Khubi)           (Khubi)            (Bhavana)         (Bhavana)             (B)
#
# Rules for every job: timeout-minutes 15, and deploy jobs name their needs:
# explicitly (GitHub counts a skipped job as a pass for required checks).

name: pipeline

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Khubi
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest, coverage gate 80%)
        run: pytest tests/unit --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Khubi
  build-and-push:
    name: build-and-push
    needs: lint-and-unit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tags
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            printf 'tags<<EOF\n%s\n%s\nEOF\n' "$IMAGE:${{ github.sha }}" "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            printf 'tags<<EOF\n%s\nEOF\n' "$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  
  # ---------------------------------------------------------------- Bhavana
  deploy-staging:
    name: deploy-staging
    needs: [build-and-push, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/deploy_key
          test -s ~/.ssh/known_hosts

      
      - name: Deploy image to Staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          set -euo pipefail

          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
            -i "$HOME/.ssh/deploy_key" ubuntu@"$STAGING_HOST")

          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" \
            "sudo docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          "${SSH[@]}" "IMAGE='$IMAGE' bash -se" <<'REMOTE'
          set -euo pipefail
          cd ~/devops-app

          test -f .env
          grep -q '^IMAGE=' .env

          sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env

          sudo docker compose pull web
          sudo docker compose up -d --no-deps web
          REMOTE


      - name: Verify Staging health
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" ubuntu@"$STAGING_HOST" \
            'for i in $(seq 1 30); do
               if curl -fsS --max-time 3 http://localhost/health; then
                 exit 0
               fi
               sleep 5
             done
             exit 1'

  
  # ---------------------------------------------------------------- Bhavana
  e2e-tests:
    name: e2e-tests
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_BASE_URL: ${{ secrets.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --force-reinstall playwright==1.58.0

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          test -n "$E2E_BASE_URL"
          pytest tests/e2e/ -v


  # ---------------------------------------------------------------- Shivi
  deploy-production:
    name: deploy-production
    needs: [build-and-push, e2e-tests]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/prod_key
          test -s ~/.ssh/known_hosts

      - name: Copy compose files and scripts to Production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/prod_key \
            docker-compose.yml \
            deploy/production/docker-compose.prod.yml \
            deploy/production/deploy.sh \
            deploy/production/rollback.sh \
            ubuntu@"$PROD_HOST":~/app/

      - name: Log Production in to GHCR
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod_key ubuntu@"$PROD_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy and smoke check
        id: deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          IMAGE: ${{ needs.build-and-push.outputs.sha_tag }}
          SIMULATE: ${{ vars.SIMULATE_BAD_RELEASE || '0' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod_key ubuntu@"$PROD_HOST" \
            "bash ~/app/deploy.sh '$IMAGE' '$SIMULATE'"

      - name: Automatic rollback
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod_key ubuntu@"$PROD_HOST" \
            "bash ~/app/rollback.sh"
          # The job still ends red, so this counts as a failed change (brief Stage 6)

  
  
  # ---------------------------------------------------------------- Bhavana
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracker:testpassword@localhost:5432/tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v

